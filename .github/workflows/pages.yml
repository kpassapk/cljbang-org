name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Build on every pull request, publish only from main.  The deploy job
# is the only one that needs to write anything.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # enableGitInfo reads the last commit that touched each page.
          fetch-depth: 0

      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      # doc/API.md is generated from the docstrings, so a change to one
      # without the other is a build failure rather than a stale page.
      - run: make doc-check

      - run: make site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
