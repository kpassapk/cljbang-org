name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 28.1 is the minimum Package-Requires claims; snapshot is the
        # early warning for org changes under us.
        emacs_version: ['28.1', '29.4', '30.1', 'snapshot']
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    steps:
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ matrix.emacs_version }}-${{ hashFiles('Makefile') }}

      - run: make test
